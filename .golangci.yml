version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - nakedret
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    govet:
      enable:
        - fieldalignment
    nolintlint:
      require-explanation: true
      require-specific: true
    depguard:
      rules:
        main:
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
            - github.com/xavi-group/bconf
            - github.com/xavi-group/bconf/bconfconst
            - gopkg.in/yaml.v3
        test:
          files:
            - $test
          allow:
            - $gostd
            - github.com/xavi-group/bconf
            - github.com/xavi-group/bconf/bconfconst
            - gopkg.in/yaml.v3

formatters:
  enable:
    - gofmt
    - goimports

run:
  issues-exit-code: 1
  timeout: 5m
